<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="Find, join and manage extra classes at the university.">
  <link rel="icon" href="{{ url_for('static', path='images/smbu-favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark">
          <img src="{{ url_for('static', path='images/smbu-favicon.ico') }}"
               width="32" height="32"
               alt="Shenzhen MSU-BIT University">
        </span>
        <span class="brand-name">Extra<span>Classes</span></span>
      </a>

      <nav class="main-nav" aria-label="Main">
        {% for item in nav %}
        <a href="{{ item.url }}"
           class="nav-link{% if active == item.key %} is-active{% endif %}"
           {% if item.key == "admin" %}data-staff-link hidden{% endif %}
           {% if active == item.key %}aria-current="page"{% endif %}>{{ item.label }}</a>
        {% endfor %}
      </nav>

      <div class="header-action">
        <a class="btn btn-primary btn-sm" href="/register#login" data-guest-action>Sign in</a>
        <div class="header-user" data-user-action hidden>
          <a class="header-profile" href="/register#account" data-user-name>Account</a>
          <button class="btn btn-ghost btn-sm" type="button" data-logout>Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; {{ current_year }} {{ site_name }}</p>
      <p class="muted">Student project &middot; campus community portal</p>
    </div>
  </footer>

  <script type="module" src="{{ url_for('static', path='js/site.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
