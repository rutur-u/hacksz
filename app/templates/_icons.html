{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if name == "user" -%}
  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
  {%- elif name == "search" -%}
  <circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/>
  {%- elif name == "calendar" -%}
  <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/>
  {%- elif name == "shield" -%}
  <path d="m12 3 7 3v5c0 4.4-2.9 8.2-7 10-4.1-1.8-7-5.6-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/>
  {%- elif name == "arrow-right" -%}
  <path d="M5 12h14M13 6l6 6-6 6"/>
  {%- elif name == "arrow-left" -%}
  <path d="M19 12H5M11 18l-6-6 6-6"/>
  {%- elif name == "moon" -%}
  <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
  {%- elif name == "sun" -%}
  <circle cx="12" cy="12" r="4.2"/>
  <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>
  {%- endif -%}
</svg>
{%- endmacro %}
